services:
  postgres:
    image: postgres:16-alpine
    container_name: isafae-postgres
    environment:
      POSTGRES_DB: isafae
      POSTGRES_USER: isafae_user
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isafae_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isafae-network

volumes:
  postgres_data:
    driver: local

networks:
  isafae-network:
    driver: bridge
